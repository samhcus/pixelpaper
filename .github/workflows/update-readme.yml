name: Update READMEs

on:
  push:
    branches:
      - main
    paths:
      - 'ai-generated/**'
      - 'ascii-art/**'
      - 'space/**'
      - 'pixel-art/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build READMEs
        run: python scripts/build_readme.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update READMEs [skip ci]"
          file_pattern: 'ai-generated/README.md ascii-art/README.md pixel-art/README.md space/README.md'
