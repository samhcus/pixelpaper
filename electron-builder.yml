appId: us.samhc.pixelpaper
productName: Pixelpaper
artifactName: Pixelpaper-${os}-${arch}.${ext}
directories:
  output: artifacts
  buildResources: desktop
asar: true
files:
  - dist/**/*
  - desktop/**/*
  - package.json
extraMetadata:
  main: desktop/main.cjs
mac:
  target: [dmg, zip]
  category: public.app-category.graphics-design
win:
  target: [nsis, portable]
linux:
  target: [AppImage, deb]
  category: Graphics
  icon: desktop/icon.png
